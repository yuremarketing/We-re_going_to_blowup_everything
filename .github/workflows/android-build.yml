name: Android CI/CD Build & Test

on:
  push:
    branches:
      - main
      - agent/claude
      - agent/antigravity
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"
  GODOT_SHA512: "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a"
  TEMPLATES_SHA512: "476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a"

jobs:
  test-headless:
    name: Headless Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot Engine Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-bin-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download & Setup Godot Engine
        run: |
          if [ "${{ steps.cache-godot.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/godot-bin
            ZIP_NAME="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
            curl -sLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${ZIP_NAME}"
            echo "${GODOT_SHA512}  ${ZIP_NAME}" | sha512sum -c
            unzip -q "${ZIP_NAME}" -d ~/godot-bin
            mv ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 ~/godot-bin/godot
            chmod +x ~/godot-bin/godot
            rm -f "${ZIP_NAME}"
          fi
          echo "$HOME/godot-bin" >> $GITHUB_PATH

      - name: Import project resources
        run: |
          ~/godot-bin/godot --headless --editor --quit

      - name: Run Headless Verification Script
        run: |
          ~/godot-bin/godot --headless -s scripts/test_mobile_setup.gd

  build-android-debug:
    name: Build Android Debug APK
    needs: test-headless
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Godot Engine Binary
        id: cache-godot-build
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-bin-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download & Setup Godot Engine
        run: |
          if [ "${{ steps.cache-godot-build.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/godot-bin
            ZIP_NAME="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
            curl -sLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${ZIP_NAME}"
            echo "${GODOT_SHA512}  ${ZIP_NAME}" | sha512sum -c
            unzip -q "${ZIP_NAME}" -d ~/godot-bin
            mv ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 ~/godot-bin/godot
            chmod +x ~/godot-bin/godot
            rm -f "${ZIP_NAME}"
          fi
          echo "$HOME/godot-bin" >> $GITHUB_PATH

      - name: Cache Godot Export Templates
        id: cache-godot-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download & Install Godot Export Templates
        run: |
          TARGET_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          if [ "${{ steps.cache-godot-templates.outputs.cache-hit }}" != "true" ] || [ ! -f "${TARGET_DIR}/android_debug.apk" ]; then
            mkdir -p "${TARGET_DIR}"
            TPZ_NAME="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
            curl -sLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${TPZ_NAME}"
            echo "${TEMPLATES_SHA512}  ${TPZ_NAME}" | sha512sum -c
            unzip -q "${TPZ_NAME}" -d /tmp/godot_templates
            mv /tmp/godot_templates/templates/* "${TARGET_DIR}/"
            rm -rf /tmp/godot_templates "${TPZ_NAME}"
          fi

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare Export Preset and Output Directory
        run: |
          cp export_presets.example.cfg export_presets.cfg
          sed -i "s|keystore/debug=.*|keystore/debug=\"$HOME/.android/debug.keystore\"|" export_presets.cfg
          mkdir -p build/android

      - name: Import project resources
        run: |
          ~/godot-bin/godot --headless --editor --quit

      - name: Export Android Debug APK
        run: |
          ~/godot-bin/godot --headless --path . --export-debug "Android" build/android/WereGoingToBlowUpEverything-debug.apk

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose build/android/WereGoingToBlowUpEverything-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WereGoingToBlowUpEverything-debug-apk
          path: build/android/WereGoingToBlowUpEverything-debug.apk
          retention-days: 14
